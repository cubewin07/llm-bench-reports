name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Data gate (schema, duplicates, canary)
        run: uv run python scripts/check_data.py
      - run: uv run pytest -q
      - name: Site builds
        run: |
          uv run python scripts/build_site_data.py --boot 300
          node --check site/app.js
